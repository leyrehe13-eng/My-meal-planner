<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Meal Planner 🌸</title>
<style>
:root{
  --pink:#f7a8c4;--pink2:#ffe3ee;--pink3:#fff5f9;--rose:#d95786;
  --yellow:#fff1a8;--green:#dff5e6;--red:#ffd9e5;--purple:#eadcff;
  --text:#493b45;--muted:#8b7b85;--white:#fff;--line:#f0dce5;
  --shadow:0 10px 30px rgba(125,74,101,.10);--radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(135deg,#fff8fb,#fff0f6 45%,#fff9f1)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{position:sticky;top:0;width:255px;height:100vh;padding:22px 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-right:1px solid var(--line);z-index:20;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 20px}
.brand .logo{font-size:30px}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;background:transparent;border-radius:14px;color:var(--text);text-align:left;transition:.18s}
.nav-item:hover,.nav-item.active{background:var(--pink2);color:var(--rose)}
.nav-item.dragging{opacity:.45}
.nav-item .drag{margin-left:auto;color:#c8aab7;cursor:grab}
.mobile-menu{display:none}
.main{flex:1;min-width:0;padding:28px;max-width:1500px;margin:auto;width:100%}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}
.page-title h2{margin:0;font-size:30px}.page-title p{margin:5px 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:13px;color:var(--text);transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:var(--pink);color:#fff;border-color:var(--pink)}.btn.soft{background:var(--pink3)}
.btn.danger{background:#fff0f4;color:#b53e67}.btn.success{background:#effbf2;color:#39754d}
.grid{display:grid;gap:16px}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3,.card h4{margin:0 0 12px}.muted{color:var(--muted)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.toolbar .grow{flex:1}
.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;color:var(--text);outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink2)}
.search{min-width:220px}.textarea{min-height:110px;resize:vertical}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#f7edf2}
.badge.pink{background:var(--pink2);color:var(--rose)}.badge.yellow{background:var(--yellow)}.badge.green{background:var(--green)}
.badge.purple{background:var(--purple)}
.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.category{margin-bottom:16px}.category-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}.category-head h3{margin:0;font-size:17px}.category-head .spacer{flex:1}
.product-list{display:grid;gap:7px}
.product{display:flex;align-items:center;gap:9px;border:1px solid var(--line);padding:10px 11px;border-radius:14px;transition:.15s}
.product.status-low{background:#fff9d8}.product.status-none{background:#fff0f5}.product:hover{transform:translateY(-1px)}
.product .name{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis}.product .sub{font-size:12px;color:var(--muted)}
.product-main{flex:1;min-width:0}.product-actions{display:flex;gap:3px;flex-wrap:wrap}
.icon-btn{border:0;background:transparent;border-radius:9px;padding:6px;font-size:16px}.icon-btn:hover{background:#f8edf3}.icon-btn.active{background:var(--pink2)}
.check{accent-color:var(--rose)}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:#fffafc}
.stat{padding:17px;border-radius:18px;background:#fff;border:1px solid var(--line)}.stat b{font-size:28px}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.progress{height:10px;background:#f4e6ed;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--pink);border-radius:999px}
.recipe-card{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.recipe-card .pct{font-size:25px;font-weight:800;color:var(--rose)}
.ingredient-row{display:grid;grid-template-columns:1fr 130px auto;gap:7px;margin-bottom:7px}
.suggestions{position:absolute;left:0;right:0;top:100%;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:180px;overflow:auto}
.suggestion{padding:9px 11px;cursor:pointer}.suggestion:hover{background:var(--pink3)}
.relative{position:relative}
.modal-backdrop{position:fixed;inset:0;background:rgba(73,59,69,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:22px;box-shadow:0 25px 80px rgba(73,59,69,.25)}
.modal h3{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field.full{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:#493b45;color:#fff;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);animation:pop .2s}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.week-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto}
.day-card{min-height:270px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px}
.day-name{font-weight:800;color:var(--rose)}.date{font-size:12px;color:var(--muted);margin-bottom:10px}
.meal-slot{border:1px solid var(--line);border-radius:12px;padding:9px;margin:8px 0;background:#fffafd;min-height:58px}.meal-slot strong{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}.meal-slot button{border:0;background:none;text-align:left;padding:0;color:var(--text);font-weight:650;width:100%}
.free{background:#faf8fb;color:var(--muted);text-align:center}
.list-section{margin-bottom:18px}.shop-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f5e9ef}.shop-row:last-child{border-bottom:0}
.shop-main{flex:1}.shop-main s{color:var(--muted)}.shop-actions{display:flex;gap:4px;flex-wrap:wrap}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.pill.active{background:var(--pink2);border-color:#f2bad0;color:var(--rose)}
.calendar-detail{display:grid;gap:10px}.detail-day{padding:12px;border:1px solid var(--line);border-radius:14px}
.checkbox-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.notice{background:#fff8df;border:1px solid #f3e3a2;border-radius:14px;padding:12px}.success-box{background:#effbf2;border:1px solid #cce9d3;border-radius:14px;padding:12px}
footer{padding:25px 0;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:980px){.sidebar{position:fixed;left:-280px;transition:.2s}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.main{padding:18px}.grid.cols-3{grid-template-columns:1fr 1fr}.week-grid{grid-template-columns:repeat(7,180px)}}
@media(max-width:680px){.main{width:100%;max-width:100%;}.card{padding:14px}.section-head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.topbar{align-items:flex-start;flex-direction:column}.grid.cols-2,.grid.cols-3{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.ingredient-row{grid-template-columns:1fr 100px auto}.search{min-width:0}.product{align-items:flex-start}.product-actions{justify-content:flex-end}.checkbox-grid{grid-template-columns:1fr 1fr}.main{padding:13px}.page-title h2{font-size:25px}}
.hidden{display:none!important}
</style>

<script>

};
const NAV=[
 ["pantry","🥬","Mi despensa"],["other","🧴","Otros"],["recipes","🍝","Recetas"],["cook","🍳","¿Qué cocino?"],
 ["shopping","🛒","Lista de la compra"],["calendar","📅","Calendario"],["freezer","❄️","Congelador"],["expiring","⏰","Caducan pronto"],["mealprep","🍱","Meal Prep"]

const SEED_PRODUCTS={

 "🧹 Limpieza":["Limpiador multiusos","Limpiacristales","Limpiador de baño","Desinfectante","Fregasuelos","Detergente para ropa","Suavizante","Quitamanchas","Bayetas","Trapos de limpieza","Guantes de limpieza","Estropajo de baño","Ambientador","Recambio de fregona"],
 "🧴 Higiene personal":["Gel de ducha","Champú","Acondicionador","Jabón de manos","Desodorante","Pasta de dientes","Cepillo de dientes","Hilo dental","Enjuague bucal","Cuchillas de afeitar","Crema hidratante","Protector solar","Algodón","Bastoncillos","Crema de manos","Bálsamo labial"],
 "🛁 Baño":["Papel higiénico","Pañuelos","Toallitas húmedas","Toallas sanitarias","Tampones","Protectores diarios","Limpiador de WC","Pastillas para WC","Escobilla de WC","Ambientador de baño"],
 "🩹 Salud":["Paracetamol","Ibuprofeno","Tiritas","Gasas","Esparadrapo","Antiséptico","Termómetro","Suero fisiológico","Mascarillas","Gel hidroalcohólico"]
};
const SEED_RECIPES=[
 ["Tortilla de patatas","meal",[["Huevos","6 uds"],["Patata","500 g"],["Cebolla","1"],["Aceite de oliva",""]]],
 ["Paella valenciana","meal",[["Arroz redondo","320 g"],["Pechuga de pollo",""],["Judías verdes","150 g"],["Pimiento rojo","1"],["Tomate triturado","100 g"],["Aceite de oliva",""]]],
 ["Paella de marisco","meal",[["Arroz redondo","320 g"],["Gambas","250 g"],["Caldo de pescado","750 ml"],["Tomate triturado","100 g"],["Pimiento rojo","1"],["Ajo","2 dientes"]]],
 ["Arroz a la cubana","meal",[["Arroz","200 g"],["Huevos","2"],["Tomate frito","150 g"],["Plátano","1"]]],
 ["Gazpacho andaluz","meal",[["Tomate","1 kg"],["Pepino","1"],["Pimiento verde","1"],["Cebolla","1/2"],["Ajo","1 diente"],["Aceite de oliva","4 cucharadas"],["Vinagre de vino","2 cucharadas"]]],
 ["Salmorejo cordobés","meal",[["Tomate","1 kg"],["Pan","150 g"],["Ajo","1 diente"],["Aceite de oliva","100 ml"],["Jamón serrano","80 g"],["Huevos","2"]]],
 ["Patatas a lo pobre","meal",[["Patata","600 g"],["Cebolla","1"],["Pimiento verde","1"],["Ajo","2 dientes"],["Aceite de oliva",""]]],
 ["Pisto manchego","meal",[["Calabacín","1"],["Berenjena","1"],["Pimiento verde","1"],["Pimiento rojo","1"],["Cebolla","1"],["Tomate triturado","400 g"],["Huevos","2"]]],
 ["Croquetas de jamón","meal",[["Jamón serrano","120 g"],["Leche","500 ml"],["Harina de trigo","50 g"],["Mantequilla","50 g"],["Huevos","2"],["Pan rallado",""]]],
 ["Albóndigas en salsa","meal",[["Carne picada","500 g"],["Huevos","1"],["Pan rallado","50 g"],["Ajo","2 dientes"],["Cebolla","1"],["Tomate triturado","300 g"]]],
 ["Lentejas estofadas","meal",[["Lentejas cocidas","400 g"],["Zanahoria","2"],["Patata","2"],["Cebolla","1"],["Chorizo","100 g"],["Pimentón dulce",""]]],
 ["Cocido madrileño fácil","meal",[["Garbanzos cocidos","400 g"],["Carne picada","200 g"],["Zanahoria","2"],["Patata","2"],["Caldo de pollo","1 l"]]],
 ["Fabada asturiana fácil","meal",[["Alubias cocidas","400 g"],["Chorizo","100 g"],["Pimentón dulce",""]]],
 ["Fideuá de gambas","meal",[["Fideos","250 g"],["Gambas","250 g"],["Caldo de pescado","700 ml"],["Tomate triturado","100 g"],["Ajo","2 dientes"]]],
 ["Bacalao con tomate","meal",[["Bacalao","400 g"],["Tomate triturado","400 g"],["Cebolla","1"],["Ajo","2 dientes"]]],
 ["Merluza a la plancha con patatas","meal",[["Merluza","400 g"],["Patata","400 g"],["Ajo","1 diente"],["Perejil",""]]],
 ["Pollo al ajillo","meal",[["Pechuga de pollo","500 g"],["Ajo","5 dientes"],["Aceite de oliva",""]]],

];
function seedProducts(){const out=[];for(const [cat,names] of Object.entries(SEED_PRODUCTS))for(const name of names)out.push({id:uid(),name,category:cat,status:"have",checked:false,frozen:false,expiry:"",autoBlocked:false,manualShop:true});return out}
function seedOther(){const out=[];for(const [cat,names] of Object.entries(SEED_OTHER))for(const name of names)out.push({id:uid(),name,category:cat,status:"have",checked:false,frozen:false,expiry:"",autoBlocked:false,manualShop:true});return out}

function initialState(){
 return {products:seedProducts(),other:seedOther(),categories:[...DEFAULT_CATS],otherCategories:Object.keys(SEED_OTHER),recipes:seedRecipes(),shopping:{defer:[],later:[],rare:[],bought:[]},planning:{},settings:{expiryDays:7,mealPrepDays:["Domingo","Miércoles"],nightOff:2,nav:NAV.map(x=>x[0]),prepExcluded:[]},route:"pantry"};
}
let state=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?normalize(x):initialState()}catch(e){return initialState()}}
function normalize(x){
 const d=initialState(); x={...d,...x}; x.settings={...d.settings,...(x.settings||{})};
 x.otherCategories=Array.isArray(x.otherCategories)?x.otherCategories:Object.keys(SEED_OTHER); x.shopping={...d.shopping,...(x.shopping||{})}; x.shopping.rare=Array.isArray(x.shopping.rare)?x.shopping.rare:[];
 x.products=Array.isArray(x.products)?x.products:[];x.other=Array.isArray(x.other)?x.other:[];x.recipes=Array.isArray(x.recipes)?x.recipes:[];x.planning=x.planning||{};
 // Si la versión anterior tenía secciones vacías, las rellenamos una sola vez sin tocar datos existentes.
 if(!x.products.length)x.products=d.products;
 if(!x.other.length)x.other=d.other;
 if(!x.recipes.length)x.recipes=d.recipes;
 // Añade a una versión anterior cualquier categoría/artículo base de “Otros” que falte.
 for(const cat of Object.keys(SEED_OTHER)){
   if(!x.otherCategories.includes(cat))x.otherCategories.push(cat);
   for(const name of SEED_OTHER[cat]){
     if(!x.other.some(p=>norm(p.name)===norm(name)&&norm(p.category)===norm(cat))){x.other.push({id:uid(),name,category:cat,status:"have",checked:false,frozen:false,expiry:"",autoBlocked:false,manualShop:true});}
   }
 }
 x.products.forEach(p=>{if(p.manualShop===undefined)p.manualShop=true;if(p.autoBlocked===undefined)p.autoBlocked=false;if(p.frozen===undefined)p.frozen=false;if(p.expiry===undefined)p.expiry=""});
 x.other.forEach(p=>{if(p.manualShop===undefined)p.manualShop=true;if(p.autoBlocked===undefined)p.autoBlocked=false;if(p.frozen===undefined)p.frozen=false;if(p.expiry===undefined)p.expiry=""});
 return x;
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function norm(s){return String(s||"").trim().toLocaleLowerCase("es")}

function saveProduct(type,id){
 const name=document.getElementById("mName").value.trim(),cat=document.getElementById("mCat").value,status=document.getElementById("mStatus").value,expiry=document.getElementById("mExpiry")?.value||"";
 if(!name)return toast("Escribe un nombre 🌷");

 if(id){const p=arr.find(x=>x.id===id);Object.assign(p,{name,category:cat,status,expiry})}

function showSuggestions(input){

 box.innerHTML=[...matches.map(n=>`<div class="suggestion" onclick="chooseIngredient(this,'${esc(n)}')">🍅 ${esc(n)}</div>`),`<div class="suggestion" onclick="newIngredient('${input.dataset.id||""}',this)">➕ Añadir “${esc(input.value)}”</div>`].join("");

function addPantryIngredient(name){
 if(productByName(name))return;
 state.products.push({id:uid(),name,category:state.categories[0],status:"none",checked:false,frozen:false,expiry:"",autoBlocked:false,manualShop:false});save();toast("Añadido a Despensa 🌸")
}
function saveRecipe(id){
 const name=document.getElementById("rName").value.trim(),type=document.getElementById("rType").value;
 if(!name)return toast("Escribe un nombre");
 const ingredients=[...document.querySelectorAll("#ingredientRows .ingredient-row")].map(row=>({name:row.querySelector(".ing-name").value.trim(),qty:row.querySelector(".ing-qty").value.trim()})).filter(x=>x.name);
 if(!ingredients.length)return toast("Añade al menos un ingrediente");
 const r={id:id||uid(),name,type,ingredients,instructions:document.getElementById("rInstructions").value.trim()};
 const old=state.recipes.findIndex(x=>x.id===r.id);if(old>=0)state.recipes[old]=r;else state.recipes.push(r);save();closeModal();render();toast("Receta guardada 💗")
}
function deleteRecipe(id){if(confirm("¿Eliminar esta receta?")){state.recipes=state.recipes.filter(r=>r.id!==id);for(const k of Object.keys(state.planning))state.planning[k]=state.planning[k]?.filter(x=>x.recipeId!==id);save();render();}}
function recipeAvailability(r){const total=r.ingredients.length;if(!total)return 0;return Math.round(r.ingredients.filter(i=>available(i.name)).length/total*100)}
function renderCook(){
 const f=state.cookFilter||"both";
 const rs=state.recipes.filter(r=>f==="meal"?r.type!=="dinner":f==="dinner"?r.type!=="meal":true).map(r=>({...r,pct:recipeAvailability(r)})).sort((a,b)=>b.pct-a.pct||a.name.localeCompare(b.name,"es"));
 return `<div class="card"><div class="section-head"><div><h3>🍳 ¿Qué cocino?</h3><span class="muted">Calculado con lo que tienes disponible ahora mismo.</span></div></div>
 <div class="filter-pills" style="margin-bottom:14px"><button class="pill ${f==="meal"?"active":""}" onclick="setCookFilter('meal')">☀️ Comidas</button><button class="pill ${f==="dinner"?"active":""}" onclick="setCookFilter('dinner')">🌙 Cenas</button><button class="pill ${f==="both"?"active":""}" onclick="setCookFilter('both')">☀️🌙 Ambas</button></div>
 ${rs.length?rs.map(r=>`<div class="card recipe-card" style="margin-bottom:9px"><div style="flex:1"><h3>${esc(r.name)}</h3><div class="progress" style="margin:9px 0"><i style="width:${r.pct}%"></i></div><div class="muted">${r.ingredients.filter(i=>available(i.name)).length} disponibles · ${r.ingredients.filter(i=>!available(i.name)).length} faltan</div><div style="margin-top:8px"><span class="badge green">Disponibles: ${r.ingredients.filter(i=>available(i.name)).map(i=>esc(i.name)).join(", ")||"ninguno"}</span></div><div style="margin-top:5px"><span class="badge pink">Faltan: ${r.ingredients.filter(i=>!available(i.name)).map(i=>esc(i.name)).join(", ")||"ninguno"}</span></div></div><div class="pct">${r.pct}%</div></div>`).join(""):`<div class="empty">No hay recetas que coincidan. Crea recetas en 🍝 Recetas para empezar.</div>`}</div>`;
}
function setCookFilter(x){state.cookFilter=x;render()}
function shoppingEntries(){
 const map=new Map();
 function add(p,type,reason="availability"){
   if(!p||p.autoBlocked)return;
   const key=type+":"+norm(p.name);
   if(!map.has(key))map.set(key,{key,productId:p.id,name:p.name,category:p.category,type,reason,checked:false});
 }
 state.products.filter(p=>p.status!=="have").forEach(p=>add(p,"pantry","Despensa"));
 state.other.filter(p=>p.status!=="have").forEach(p=>add(p,"other","Otros"));
 for(const [day,slots] of Object.entries(state.planning))for(const slot of ["meal","dinner"]){
   const rid=slots?.[slot]?.recipeId;if(!rid)continue;const r=state.recipes.find(x=>x.id===rid);if(!r)continue;
   r.ingredients.forEach(i=>{const p=productByName(i.name);if(!p)add({id:"need:"+norm(i.name),name:i.name,category:"Necesidades de planificación",status:"none",manualShop:true},"pantry","Planificación")});
 }
 return [...map.values()];
}
function isInList(list,p){return list.some(x=>x.key===p.key)}
function renderShopping(){
 const active=shoppingEntries().filter(p=>!state.shopping.defer.some(x=>x.key===p.key)&&!state.shopping.later.some(x=>x.key===p.key)&&!state.shopping.rare.some(x=>x.key===p.key));
 const pct=active.length?Math.round(active.filter(p=>state.shopping.bought.some(x=>x.key===p.key)).length/active.length*100):0;
 const group=(type)=>{const a=active.filter(p=>p.type===type);const cats=[...new Set(a.map(p=>p.category))];return cats.map(c=>`<div class="list-section"><h4>${esc(c)}</h4>${a.filter(p=>p.category===c).map(shopRow).join("")}</div>`).join("")||`<div class="empty">Nada pendiente en ${type==="pantry"?"Despensa":"Otros"} 🎀</div>`};
 return `<div class="grid cols-3"><div class="stat"><b>${active.length}</b><span>en lista activa</span></div><div class="stat"><b>${pct}%</b><span>comprado</span></div><div class="stat"><b>${state.shopping.defer.length+state.shopping.later.length+state.shopping.rare.length}</b><span>aparcados</span></div></div>
 <div class="card" style="margin-top:16px"><div class="section-head"><div><h3>🛒 Lista de la compra</h3><span class="muted">Fuente: Despensa + Otros + necesidades del Calendario.</span></div><div class="actions"><button class="btn primary" onclick="finishShopping()">🛒 Finalizar compra</button></div></div><div class="progress" style="margin-bottom:18px"><i style="width:${pct}%"></i></div>
 <h3>🥬 Despensa</h3>${group("pantry")}<h3>🏠 Otros</h3>${group("other")}
 <hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="grid cols-3"><div><h3>💗 Dejar para después</h3><div class="muted" style="font-size:12px;margin:-5px 0 8px">Volverán automáticamente al terminar esta compra.</div>${parkingList("defer")}</div><div><h3>🕐 Comprar más adelante</h3><div class="muted" style="font-size:12px;margin:-5px 0 8px">Solo vuelven cuando tú decidas añadirlos.</div>${parkingList("later")}</div><div><h3>🚫 No suelo comprar</h3><div class="muted" style="font-size:12px;margin:-5px 0 8px">No aparecerán automáticamente hasta que los reactives.</div>${parkingList("rare")}</div></div></div>`;
}
function shopRow(p){
 const bought=state.shopping.bought.some(x=>x.key===p.key);
 return `<div class="shop-row"><input class="check" type="checkbox" ${bought?"checked":""} onchange="toggleBought('${esc(p.key)}',this.checked)"><div class="shop-main">${bought?`<s>${esc(p.name)}</s>`:`<strong>${esc(p.name)}</strong>`}<div class="sub">${esc(p.category)} · ${esc(p.reason)}</div></div><div class="shop-actions"><button class="icon-btn" onclick="park('${esc(p.key)}','defer')" title="Dejar para después">💗</button><button class="icon-btn" onclick="park('${esc(p.key)}','later')" title="Comprar más adelante">🕐</button><button class="icon-btn" onclick="park('${esc(p.key)}','rare')" title="No suelo comprar">🚫</button></div></div>`;
}
function parkingList(kind){
 const a=state.shopping[kind]||[];if(!a.length)return `<div class="empty">Vacío 🌷</div>`;
 return a.map(x=>`<div class="shop-row"><div class="shop-main"><strong>${esc(x.name)}</strong><div class="sub">${esc(x.category||"")}</div></div><button class="btn soft" onclick="restorePark('${esc(x.key)}','${kind}')">🛒 ${kind==="rare"?"Volver a la lista":"Añadir a la lista"}</button><button class="icon-btn" onclick="removePark('${esc(x.key)}','${kind}')">🗑️</button></div>`).join("");
}
function toggleBought(key,val){if(val){if(!state.shopping.bought.some(x=>x.key===key)){const p=shoppingEntries().find(x=>x.key===key);if(p)state.shopping.bought.push(p)}}else state.shopping.bought=state.shopping.bought.filter(x=>x.key!==key);save();render()}
function park(key,kind){
 const p=shoppingEntries().find(x=>x.key===key);if(!p)return;
 if(!state.shopping[kind].some(x=>x.key===key))state.shopping[kind].push({...p});
 state.shopping.bought=state.shopping.bought.filter(x=>x.key!==key);
 if(kind==="rare"&&p.productId){const src=p.type==="other"?state.other:state.products;const obj=src.find(x=>x.id===p.productId);if(obj)obj.autoBlocked=true;}
 save();render();toast(kind==="defer"?"Guardado para después 💗":kind==="later"?"Guardado para más adelante 🕐":"Marcado como “No suelo comprar” 🚫")
}
function restorePark(key,kind){
 const item=(state.shopping[kind]||[]).find(x=>x.key===key);
 state.shopping[kind]=state.shopping[kind].filter(x=>x.key!==key);
 if(kind==="rare"&&item){const src=item.type==="other"?state.other:state.products;const p=src.find(x=>x.id===item.productId);if(p)p.autoBlocked=false;}
 save();render();
}
function removePark(key,kind){state.shopping[kind]=state.shopping[kind].filter(x=>x.key!==key);save();render()}
function blockAuto(key){
 const p=shoppingEntries().find(x=>x.key===key);if(!p)return;
 const src=p.type==="other"?state.other:state.products;const obj=src.find(x=>x.id===p.productId);
 if(obj){obj.autoBlocked=true;save();render();toast("No volverá automáticamente 🚫")}
}
function finishShopping(){
 const active=shoppingEntries().filter(p=>!state.shopping.defer.some(x=>x.key===p.key)&&!state.shopping.later.some(x=>x.key===p.key));
 const bought=active.filter(p=>state.shopping.bought.some(x=>x.key===p.key));
 if(!bought.length && !state.shopping.defer.length)return toast("Marca primero lo que has comprado 💗");
 if(!confirm("¿Seguro que quieres finalizar la compra?"))return;
 bought.forEach(x=>{const src=x.type==="other"?state.other:state.products;const p=src.find(p=>p.id===x.productId);if(p){p.status="have";p.manualShop=false;p.autoBlocked=false}});
 state.shopping.bought=state.shopping.bought.filter(x=>!bought.some(y=>y.key===x.key));
 const deferred=state.shopping.defer.splice(0);
 save();render();toast(deferred.length?`Compra finalizada ✨ ${deferred.length} artículo${deferred.length===1?" vuelve":"s vuelven"} a la lista.`:"Compra finalizada ✨")
}
function renderCalendar(){
 const weekStart=getWeekStart(state.calendarWeek||0), dates=[...Array(7)].map((_,i)=>addDays(weekStart,i));
 const keyBase=weekKey(weekStart), planned=state.planning[keyBase]||{};
 return `<div class="card"><div class="week-nav"><button class="btn" onclick="changeWeek(-1)">← Semana anterior</button><div><h3 style="margin:0">${formatDate(iso(weekStart))} – ${formatDate(iso(dates[6]))}</h3><div class="muted">Semana guardada: ${keyBase}</div></div><button class="btn" onclick="changeWeek(1)">Semana siguiente →</button></div>
 <div class="toolbar"><button class="btn primary" onclick="generateWeek('${keyBase}')">✨ Generar semana</button><button class="btn soft" onclick="openWeekSettings()">⚙️ Noches sin cena: ${state.settings.nightOff}</button><button class="btn" onclick="showWeekDetail('${keyBase}')">📖 Ver detalle de esta semana</button></div>
 <div class="week-grid">${dates.map((d,i)=>dayCard(d,i,keyBase,planned)).join("")}</div></div>`;
}
function getWeekStart(offset=0){const d=new Date();d.setHours(0,0,0,0);const day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1)+offset*7);return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function iso(d){return d.toISOString().slice(0,10)}
function weekKey(d){return iso(d)}
function changeWeek(n){state.calendarWeek=(state.calendarWeek||0)+n;render()}
const dayNames=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
function dayCard(d,i,key,planned){
 const x=planned[i]||{};
 return `<div class="day-card"><div class="day-name">${dayNames[i]}</div><div class="date">${formatDate(iso(d))}</div>
 <div class="meal-slot"><strong>☀️ COMIDA</strong>${x.meal?.recipeId?`<button onclick="chooseCalendarRecipe('${key}',${i},'meal')">${esc(state.recipes.find(r=>r.id===x.meal.recipeId)?.name||"Receta eliminada")}</button>`:`<button onclick="chooseCalendarRecipe('${key}',${i},'meal')">＋ Elegir comida</button>`}</div>
 <div class="meal-slot ${x.dinner?.free?"free":""}"><strong>🌙 CENA</strong>${x.dinner?.free?`<span>Noche libre 💗</span>`:x.dinner?.recipeId?`<button onclick="chooseCalendarRecipe('${key}',${i},'dinner')">${esc(state.recipes.find(r=>r.id===x.dinner.recipeId)?.name||"Receta eliminada")}</button>`:`<button onclick="chooseCalendarRecipe('${key}',${i},'dinner')">＋ Elegir cena</button>`}</div>
 <div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn soft" onclick="regenerateSlot('${key}',${i},'meal')">🔄 Comida</button><button class="btn soft" onclick="regenerateSlot('${key}',${i},'dinner')">🔄 Cena</button><button class="btn" onclick="setFreeDay('${key}',${i})">🌙 Libre</button></div></div>`;
}
function generateWeek(key){
 if(!state.recipes.length)return toast("Necesitas al menos una receta 🌸");
 const off=Math.min(7,Math.max(0,Number(state.settings.nightOff)||0));const freeDays=new Set([...Array(7).keys()].sort(()=>Math.random()-.5).slice(0,off));
 const plan={};
 for(let i=0;i<7;i++){plan[i]={meal:{recipeId:pickRecipe("meal",plan,i)?.id||null},dinner:freeDays.has(i)?{free:true}:{recipeId:pickRecipe("dinner",plan,i)?.id||null}}}
 state.planning[key]=plan;save();render();toast("Semana generada con variedad ✨")
}
function pickRecipe(kind,plan,i){
 const candidates=state.recipes.filter(r=>kind==="meal"?r.type!=="dinner":r.type!=="meal");if(!candidates.length)return null;
 const scores=candidates.map(r=>{let s=recipeAvailability(r);const recent=Object.values(plan).slice(Math.max(0,i-3),i).flatMap(x=>[x.meal?.recipeId,x.dinner?.recipeId]);if(recent.includes(r.id))s-=35;return {r,s:s+Math.random()*15}}).sort((a,b)=>b.s-a.s);return scores[0]?.r||null;
}
function chooseCalendarRecipe(key,i,slot){
 const valid=state.recipes.filter(r=>slot==="meal"?r.type!=="dinner":r.type!=="meal");if(!valid.length)return toast("No hay recetas válidas para este tipo");
 const opts=valid.map((r,j)=>`${j+1}. ${r.name}`).join("\n");
 const n=prompt(`Elige una receta escribiendo su número:\\n\\n${opts}`);const idx=Number(n)-1;if(!Number.isInteger(idx)||!valid[idx])return;
 state.planning[key]=state.planning[key]||{};state.planning[key][i]=state.planning[key][i]||{};state.planning[key][i][slot]={recipeId:valid[idx].id};save();render()
}
function regenerateSlot(key,i,slot){
 const plan=state.planning[key]||{};const r=pickRecipe(slot,plan,i);if(!r)return toast("No hay recetas válidas");
 state.planning[key]=plan;plan[i]=plan[i]||{};plan[i][slot]={recipeId:r.id};save();render();toast("Comida regenerada ✨")
}
function setFreeDay(key,i){state.planning[key]=state.planning[key]||{};state.planning[key][i]=state.planning[key][i]||{};state.planning[key][i].dinner={free:true};save();render()}
function openWeekSettings(){
 modal(`<h3>🌙 Planificación semanal</h3><p>¿Cuántas noches no vas a cenar?</p><select class="select" id="nightOff">${[0,1,2,3,4,5,6,7].map(n=>`<option ${n===state.settings.nightOff?"selected":""}>${n}</option>`).join("")}</select><div class="notice" style="margin-top:12px">Las noches libres se asignan al generar una semana. Puedes cambiarlas manualmente después.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveWeekSettings()">Guardar</button></div>`)
}
function saveWeekSettings(){state.settings.nightOff=Number(document.getElementById("nightOff").value);save();closeModal();render()}
function showWeekDetail(key){
 const p=state.planning[key]||{};const html=[0,1,2,3,4,5,6].map(i=>{const x=p[i]||{};const m=x.meal?.recipeId?state.recipes.find(r=>r.id===x.meal.recipeId)?.name:"—";const d=x.dinner?.free?"Noche libre":x.dinner?.recipeId?state.recipes.find(r=>r.id===x.dinner.recipeId)?.name:"—";return `<div class="detail-day"><b>${dayNames[i]}</b><div>☀️ ${esc(m||"—")}</div><div>🌙 ${esc(d||"—")}</div></div>`}).join("");
 modal(`<h3>📖 Detalle de la semana</h3><div class="calendar-detail">${html}</div><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Cerrar</button></div>`)
}
function renderMealPrep(){
 const key=weekKey(getWeekStart(state.calendarWeek||0)),p=state.planning[key]||{};
 const days=state.settings.mealPrepDays||["Domingo","Miércoles"], excluded=state.settings.prepExcluded||[];
 const recipeIds=Object.values(p).flatMap(x=>[x.meal?.recipeId,x.dinner?.recipeId]).filter(Boolean);
 const recipes=recipeIds.map(id=>state.recipes.find(r=>r.id===id)).filter(Boolean);
 const ing=new Map();recipes.forEach(r=>r.ingredients.forEach(i=>{const p=productByName(i.name);const cat=p?.category||"Sin categoría";if(!excluded.includes(cat)){if(!ing.has(i.name))ing.set(i.name,{name:i.name,qty:[],cat});if(i.qty)ing.get(i.name).qty.push(i.qty)}}));
 return `<div class="card"><div class="section-head"><div><h3>🍱 Meal Prep</h3><span class="muted">Preparación basada en la semana actualmente seleccionada.</span></div><button class="btn primary" onclick="openPrepSettings()">⚙️ Configurar</button></div>
 <div class="grid cols-2"><div><h4>📅 Días</h4><div class="checkbox-grid">${["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"].map(d=>`<label class="badge ${days.includes(d)?"pink":""}" style="cursor:pointer"><input type="checkbox" ${days.includes(d)?"checked":""} onchange="togglePrepDay('${d}',this.checked)"> ${d}</label>`).join("")}</div><p class="muted">Recomendación: 2 días por la nevera pequeña. Máximo 3.</p></div><div><h4>🚫 Categorías excluidas</h4><div class="checkbox-grid">${[...new Set([...state.categories,...state.otherCategories])].map(c=>`<label class="badge ${excluded.includes(c)?"pink":""}" style="cursor:pointer"><input type="checkbox" ${excluded.includes(c)?"checked":""} onchange="togglePrepExclude('${esc(c)}',this.checked)"> ${esc(c)}</label>`).join("")}</div></div></div>
 <hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>🥕 Preparaciones sugeridas</h3>${recipes.length?`<div class="product-list">${[...ing.values()].map(x=>`<div class="product"><div class="product-main"><div class="name">${esc(x.name)}</div><div class="sub">${esc(x.cat)}${x.qty.length?" · "+esc([...new Set(x.qty)].join(" / ")):""}</div></div><span class="badge green">preparar</span></div>`).join("")}</div><div class="success-box" style="margin-top:12px">Se han agrupado ingredientes repetidos para reducir trabajo y evitar ocupar demasiado espacio en la nevera. 🌸</div>`:`<div class="empty">Genera una semana en 📅 Calendario para que Meal Prep pueda analizarla.</div>`}</div>`;
}
function togglePrepDay(d,val){let a=state.settings.mealPrepDays||[];if(val&&a.length<3&&!a.includes(d))a.push(d);if(!val)a=a.filter(x=>x!==d);state.settings.mealPrepDays=a;save();render()}
function togglePrepExclude(c,val){let a=state.settings.prepExcluded||[];if(val&&!a.includes(c))a.push(c);if(!val)a=a.filter(x=>x!==c);state.settings.prepExcluded=a;save();render()}
function openPrepSettings(){toast("Selecciona los días y exclusiones directamente en esta pantalla 💗")}
function modal(content){closeModal();const d=document.createElement("div");d.className="modal-backdrop";d.id="modalRoot";d.innerHTML=`<div class="modal">${content}</div>`;d.addEventListener("click",e=>{if(e.target===d)closeModal()});document.body.appendChild(d)}
function closeModal(){document.getElementById("modalRoot")?.remove()}
function openSettings(){
 modal(`<h3>⚙️ Configuración</h3><div class="field"><label>Caducan pronto: próximos días</label><input class="input" id="setExpiry" type="number" min="0" value="${state.settings.expiryDays}"></div>
 <div class="notice" style="margin-top:12px">Los datos se almacenan en localStorage de este navegador. Cerrar o recargar la web no los borra.</div>
 <div class="modal-actions"><button class="btn danger" onclick="resetAll()">🗑️ Restablecer todo</button><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveSettings()">Guardar</button></div>`)
}
function saveSettings(){state.settings.expiryDays=Math.max(0,Number(document.getElementById("setExpiry").value)||0);save();closeModal();render()}
function resetAll(){if(!confirm("Esto borrará todos tus datos guardados en esta web. ¿Continuar?"))return;localStorage.removeItem(KEY);state=initialState();closeModal();render();toast("Datos restablecidos")}
function showDataHelp(){modal(`<h3>💾 Datos y persistencia</h3><p>Esta versión guarda automáticamente productos, categorías, recetas, planificación, compras, exclusiones, configuración y orden del menú en el navegador.</p><p class="muted">No necesitas crear una cuenta ni servidor para usarla. Si borras los datos del sitio desde el navegador, también se borrará la información de la aplicación.</p><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Entendido</button></div>`)}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>

<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
